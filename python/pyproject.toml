[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hy-harness"
version = "0.2.0"
description = "Drive the HY-HARNESS agent from Python (JSON-RPC over stdio)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HY-HARNESS" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Code Generators",
]

[tool.setuptools]
packages = ["hy_harness"]
