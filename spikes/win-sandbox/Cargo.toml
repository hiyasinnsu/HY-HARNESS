[package]
name = "win-sandbox-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Throwaway Phase 1 spike (design §Phase 1). Not a member of the main workspace.
[workspace]

[[bin]]
name = "win-sandbox"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_SystemServices",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }
